plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

configurations {
    avroTools
}

dependencies {
    avroTools 'org.apache.avro:avro-tools:1.12.0'
    implementation project(':outbox-event:common-event')
    api 'org.apache.avro:avro:1.12.0'
}

tasks.register('generateAvroJava', JavaExec) {
    classpath = configurations.avroTools
    mainClass = 'org.apache.avro.tool.Main'
    args = ['compile', 'schema', 'src/avro', 'build/generated-main-avro-java']
}

sourceSets {
    main {
        java {
            srcDir 'build/generated-main-avro-java'
        }
    }
}

compileJava.dependsOn generateAvroJava

group = 'com.vroong.outbox'
version = '1.0.3-SNAPSHOT'

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            
            pom {
                name = 'Dispatch Event'
                description = 'Dispatch domain Avro event definitions for outbox pattern'
            }
        }
    }
}