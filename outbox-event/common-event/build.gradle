plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

configurations {
    avroTools
}

dependencies {
    avroTools 'org.apache.avro:avro-tools:1.12.0'
    api 'org.apache.avro:avro:1.12.0'

    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

task generateAvroJava(type: JavaExec) {
    classpath = configurations.avroTools
    mainClass = 'org.apache.avro.tool.Main'
    args = ['compile', 'schema', 'src/avro', 'build/generated-main-avro-java']
}

sourceSets {
    main {
        java {
            srcDir 'build/generated-main-avro-java'
        }
    }
}

compileJava.dependsOn generateAvroJava

group = 'com.vroong.outbox'
version = '1.0.1-SNAPSHOT'

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            
            pom {
                name = 'Common Event'
                description = 'Common Avro event definitions for outbox pattern'
            }
        }
    }
}